<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Portfolio profesional.">
	<meta property="og:title" content="Portfolio">
	<meta property="og:description" content="Portfolio profesional.">
	<meta property="og:image" content="">
	<meta property="og:url" content="">
	<title>Portfolio</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/user-dashboard.css">
	<script src="js/firebase-config.js"></script>
	<script src="js/firebase-config-bridge.js"></script>
	<script type="module" src="js/portfolio-public.js"></script>
</head>
<body class="builder-portfolio">
	<header class="navbar">
		<div class="nav-container">
			<a class="logo" href="#profile-section" aria-label="Portfolio home"><span class="logo-mark" id="portfolio-mark">PB</span><span class="logo-copy"><strong id="portfolio-brand">PORTFOLIO</strong><small id="portfolio-headline">PROFESSIONAL PROFILE</small></span></a>
			<button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="portfolio-navigation"><span></span><span></span><span></span></button>
			<nav class="nav-menu" id="portfolio-navigation" aria-label="Portfolio sections"></nav>
			<div id="google_translate_element" class="translate-control" aria-label="Translate website"></div>
		</div>
	</header>
	<main id="portfolio-content" hidden>
		<section class="hero" id="profile-section">
			<div class="hero-content">
				<p class="hero-label" id="portfolio-focus"></p>
				<h1 id="portfolio-name"></h1>
				<p class="hero-description" id="portfolio-title"></p>
				<p class="hero-description" id="portfolio-bio"></p>
				<div class="hero-info" id="portfolio-info"></div>
				<div class="hero-buttons">
					<a class="btn btn-primary" id="portfolio-explore" href="#portfolio-sections">Explore Portfolio</a>
					<a class="btn btn-secondary" id="portfolio-contact-action" hidden></a>
					<a class="btn btn-cv" id="portfolio-cv-action" hidden target="_blank" rel="noopener noreferrer">Download CV</a>
				</div>
			</div>
			<div class="hero-visual" id="profile-visual" hidden>
				<div class="profile-frame">
					<div class="profile-photo"><img id="portfolio-image" alt="" hidden></div>
					<div class="profile-tag"><span>Based in</span><strong id="portfolio-location"></strong></div>
				</div>
			</div>
		</section>
		<div class="user-portfolio-sections" id="portfolio-sections"></div>
	</main>
	<main class="portfolio-state" id="portfolio-state" role="status" aria-live="polite"><div><p class="page-label">PORTFOLIO BUILDER</p><h1>Memuat portfolio...</h1><p>Mohon tunggu sebentar.</p></div></main>
	<footer><p>&copy; <span id="portfolio-year"></span> <span id="portfolio-footer-name">Portfolio Builder</span></p></footer>
	<script src="js/main.js"></script>
</body>
</html>
